[toolchain]
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.localnet]
arithmetic_basics = "2MsFAjeMf2ddQxUNrfqeH7m1r5cTFaJhtgS5k7Lg3St1"

[registry]
url = "https://api.apr.dev"

[provider]
